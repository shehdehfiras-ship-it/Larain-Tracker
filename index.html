<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#ffdce8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Larain ✨" />
<title>Larain's Daily Check-In 🌸</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #4f394a;
    --muted: #8b6a7f;
    --pink: #ff7eae;
    --pink-soft: #ffe0eb;
    --rose: #d84f7f;
    --peach: #ffd2a6;
    --mint: #cdeee6;
    --mint-strong: #82c8bb;
    --lavender: #e4d7ff;
    --cream: #fffaf5;
    --paper: rgba(255, 255, 255, 0.82);
    --line: rgba(216, 79, 127, 0.18);
    --shadow: 0 16px 40px rgba(117, 62, 91, 0.14);
  }

  * {
    box-sizing: border-box;
  }

  html {
    min-height: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 14px 56px;
    overflow-x: hidden;
    color: var(--ink);
    font-family: "Quicksand", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      linear-gradient(120deg, rgba(255, 255, 255, 0.55) 0 1px, transparent 1px 72px),
      linear-gradient(150deg, #fff8f2 0%, #ffe9f2 42%, #edf8f5 100%);
  }

  button,
  textarea {
    font: inherit;
  }

  button {
    color: inherit;
  }

  .app-shell {
    width: min(100%, 520px);
    margin: 0 auto;
  }

  .hero {
    position: relative;
    padding: 12px 2px 18px;
    text-align: center;
  }

  .eyebrow {
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    color: var(--rose);
    font-family: "Caveat", cursive;
    font-size: 48px;
    line-height: 0.98;
    text-shadow: 0 2px 0 rgba(255, 255, 255, 0.85);
  }

  .date {
    margin-top: 8px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
  }

  .love-note {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 14px;
    align-items: start;
    margin: 8px 0 14px;
    padding: 16px;
    border: 1px solid rgba(216, 79, 127, 0.2);
    border-radius: 8px;
    background:
      linear-gradient(90deg, rgba(255, 126, 174, 0.1), rgba(130, 200, 187, 0.12)),
      var(--paper);
    box-shadow: var(--shadow);
  }

  .note-icon,
  .habit-emoji {
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border: 1px solid rgba(216, 79, 127, 0.14);
    border-radius: 8px;
    background: #ffffff;
    box-shadow: 0 8px 20px rgba(117, 62, 91, 0.1);
    font-size: 27px;
  }

  .note-kicker {
    color: var(--rose);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .note-text {
    margin: 5px 0 0;
    color: var(--ink);
    font-family: "Caveat", cursive;
    font-size: 28px;
    font-weight: 700;
    line-height: 1.14;
  }

  .note-signoff {
    margin-top: 8px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
  }

  .today-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }

  .mini-panel,
  .summary,
  .mood-card,
  .tiny-win,
  .week-panel {
    border: 1px solid rgba(255, 255, 255, 0.72);
    border-radius: 8px;
    background: var(--paper);
    box-shadow: 0 10px 26px rgba(117, 62, 91, 0.1);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .mini-panel {
    min-height: 112px;
    padding: 14px;
  }

  .panel-label {
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .streak-count {
    margin-top: 8px;
    color: var(--rose);
    font-size: 28px;
    font-weight: 800;
    line-height: 1;
  }

  .streak-sub,
  .progress-copy {
    margin-top: 6px;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.35;
  }

  .progress-number {
    margin-top: 8px;
    color: var(--ink);
    font-size: 22px;
    font-weight: 800;
  }

  .progress-track {
    height: 9px;
    margin-top: 10px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(216, 79, 127, 0.13);
  }

  .progress-fill {
    width: 0%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--pink), var(--mint-strong));
    transition: width 250ms ease;
  }

  .mood-card {
    margin-bottom: 14px;
    padding: 14px;
  }

  .mood-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }

  .mood-selected {
    color: var(--rose);
    font-size: 13px;
    font-weight: 800;
  }

  .mood-options {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
  }

  .mood-button {
    min-height: 72px;
    padding: 9px 6px;
    border: 1px solid rgba(216, 79, 127, 0.16);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.68);
    cursor: pointer;
    transition: transform 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
  }

  .mood-button:hover,
  .habit-card:hover {
    transform: translateY(-1px);
  }

  .mood-button[aria-pressed="true"] {
    border-color: rgba(216, 79, 127, 0.5);
    background: linear-gradient(135deg, rgba(255, 224, 235, 0.92), rgba(205, 238, 230, 0.86));
    box-shadow: 0 8px 18px rgba(117, 62, 91, 0.12);
  }

  .mood-emoji {
    display: block;
    font-size: 32px;
  }

  .mood-name {
    display: block;
    margin-top: 4px;
    color: var(--ink);
    font-size: 12px;
    font-weight: 800;
  }

  .habit-list {
    display: grid;
    gap: 10px;
  }

  .habit-card {
    width: 100%;
    padding: 14px;
    border: 1px solid rgba(255, 255, 255, 0.74);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.78);
    box-shadow: 0 10px 24px rgba(117, 62, 91, 0.1);
    cursor: pointer;
    text-align: left;
    transition: transform 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
    -webkit-tap-highlight-color: transparent;
  }

  .habit-card:active,
  .mood-button:active {
    transform: scale(0.99);
  }

  .habit-card.done {
    border-color: rgba(130, 200, 187, 0.45);
    background: linear-gradient(135deg, rgba(255, 233, 242, 0.94), rgba(230, 248, 244, 0.94));
    box-shadow: 0 14px 28px rgba(117, 62, 91, 0.13);
  }

  .habit-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 12px;
    align-items: center;
  }

  .habit-title {
    margin: 0 0 3px;
    color: var(--ink);
    font-size: 16px;
    font-weight: 800;
    line-height: 1.2;
  }

  .habit-sub {
    margin: 0;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.3;
  }

  .check {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    border: 2px solid rgba(216, 79, 127, 0.28);
    border-radius: 999px;
    background: #ffffff;
    color: #ffffff;
    flex: 0 0 auto;
    transition: background 180ms ease, border-color 180ms ease;
  }

  .habit-card.done .check {
    border-color: transparent;
    background: linear-gradient(135deg, var(--pink), var(--mint-strong));
  }

  .check svg {
    opacity: 0;
    transition: opacity 160ms ease;
  }

  .habit-card.done .check svg {
    opacity: 1;
  }

  .summary {
    display: none;
    margin-top: 14px;
    padding: 16px;
    text-align: center;
  }

  .summary.is-visible {
    display: block;
  }

  .summary-msg {
    color: var(--rose);
    font-family: "Caveat", cursive;
    font-size: 31px;
    font-weight: 700;
    line-height: 1.06;
  }

  .summary-sub {
    margin-top: 7px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
    line-height: 1.35;
  }

  .tiny-win {
    margin-top: 14px;
    padding: 14px;
  }

  .tiny-win label {
    display: block;
    color: var(--rose);
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .tiny-win textarea {
    width: 100%;
    min-height: 78px;
    margin-top: 10px;
    padding: 12px;
    resize: vertical;
    border: 1px solid rgba(216, 79, 127, 0.18);
    border-radius: 8px;
    outline: none;
    background: rgba(255, 255, 255, 0.72);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.45;
  }

  .tiny-win textarea:focus {
    border-color: rgba(216, 79, 127, 0.52);
    box-shadow: 0 0 0 3px rgba(255, 126, 174, 0.16);
  }

  .save-state {
    min-height: 18px;
    margin-top: 7px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  .share-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 10px;
  }

  .share-button {
    min-height: 40px;
    padding: 0 14px;
    border: 1px solid rgba(216, 79, 127, 0.22);
    border-radius: 8px;
    background: linear-gradient(135deg, rgba(255, 224, 235, 0.92), rgba(205, 238, 230, 0.86));
    color: var(--ink);
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
  }

  .share-button:active {
    transform: scale(0.99);
  }

  .week-panel {
    margin-top: 14px;
    padding: 14px;
  }

  .week-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }

  .week-title {
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .week-score {
    color: var(--rose);
    font-size: 13px;
    font-weight: 800;
  }

  .week-strip {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 7px;
  }

  .day-cell {
    min-width: 0;
    min-height: 66px;
    padding: 8px 3px;
    border: 1px solid rgba(216, 79, 127, 0.13);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.58);
    color: var(--muted);
    text-align: center;
    font-size: 11px;
    font-weight: 800;
  }

  .day-cell.today {
    border-color: rgba(216, 79, 127, 0.45);
    box-shadow: inset 0 0 0 1px rgba(216, 79, 127, 0.22);
  }

  .day-dot {
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    margin: 5px auto 0;
    border: 1px solid rgba(216, 79, 127, 0.18);
    border-radius: 999px;
    background: #ffffff;
    color: var(--rose);
    font-size: 11px;
  }

  .day-cell.partial .day-dot {
    background: var(--pink-soft);
  }

  .day-cell.full .day-dot {
    border-color: transparent;
    background: linear-gradient(135deg, var(--pink), var(--mint-strong));
    color: #ffffff;
  }

  .day-mood {
    display: block;
    height: 17px;
    margin-top: 3px;
    font-size: 13px;
  }

  .footer-note {
    margin-top: 24px;
    color: var(--rose);
    font-family: "Caveat", cursive;
    font-size: 25px;
    font-weight: 700;
    text-align: center;
  }

  .heart {
    display: inline-block;
    transform-origin: center;
    animation: beat 1.7s ease-in-out infinite;
  }

  .confetti {
    position: fixed;
    top: -28px;
    z-index: 20;
    pointer-events: none;
    font-size: 24px;
    animation: fall 2600ms ease-out forwards;
  }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.14); }
  }

  @keyframes fall {
    0% {
      opacity: 1;
      transform: translateY(-20px) rotate(0deg);
    }
    100% {
      opacity: 0;
      transform: translateY(105vh) rotate(640deg);
    }
  }

  @media (max-width: 430px) {
    body {
      padding: 18px 10px 46px;
    }

    h1 {
      font-size: 42px;
    }

    .today-grid {
      grid-template-columns: 1fr;
    }

    .mood-options {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .share-row {
      align-items: stretch;
      flex-direction: column;
    }

    .share-button {
      width: 100%;
    }

    .love-note {
      grid-template-columns: 1fr;
      text-align: center;
    }

    .note-icon {
      margin: 0 auto;
    }

    .habit-row {
      grid-template-columns: auto 1fr auto;
      gap: 10px;
    }

    .note-text {
      font-size: 26px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div class="eyebrow">today's little ritual</div>
      <h1>hi larain ✨</h1>
      <div class="date" id="date"></div>
    </header>

    <section class="love-note" aria-label="A little note from me">
      <div class="note-icon" aria-hidden="true">💌</div>
      <div>
        <div class="note-kicker">a little note from me</div>
        <p class="note-text" id="loveNote"></p>
        <div class="note-signoff">always cheering for you</div>
      </div>
    </section>

    <section class="today-grid" aria-label="Today overview">
      <div class="mini-panel">
        <div class="panel-label">streak</div>
        <div class="streak-count" id="streak">0 days</div>
        <div class="streak-sub" id="streakSub">A soft restart still counts.</div>
      </div>

      <div class="mini-panel">
        <div class="panel-label">today</div>
        <div class="progress-number" id="progressNumber">0/3</div>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-copy" id="progressCopy">Pick one tiny thing first.</div>
      </div>
    </section>

    <section class="mood-card" aria-label="Mood check-in">
      <div class="mood-head">
        <div class="panel-label">today feels</div>
        <div class="mood-selected" id="moodSelected">not picked yet</div>
      </div>
      <div class="mood-options" id="moodOptions"></div>
    </section>

    <section class="habit-list" id="cardsContainer" aria-label="Daily check-in list"></section>

    <section class="summary" id="summary" aria-live="polite">
      <div class="summary-msg" id="summaryMsg"></div>
      <div class="summary-sub" id="summarySub"></div>
    </section>

    <section class="tiny-win">
      <label for="tinyWin">message to Firas</label>
      <textarea id="tinyWin" maxlength="220" placeholder="write me anything you want me to know"></textarea>
      <div class="share-row">
        <button class="share-button" type="button" id="shareButton">Copy for Firas</button>
        <div class="save-state" id="saveState" aria-live="polite"></div>
      </div>
    </section>

    <section class="week-panel" aria-label="This week">
      <div class="week-head">
        <div class="week-title">this week</div>
        <div class="week-score" id="weekScore">0 checks</div>
      </div>
      <div class="week-strip" id="weekStrip"></div>
    </section>

    <div class="footer-note">made with <span class="heart">💗</span> for you</div>
  </main>

<script>
  const HABITS = [
    { id: "skincare", emoji: "✨", title: "Skincare glow", sub: "a little reset for your face and your mood" },
    { id: "freezer", emoji: "🍲", title: "Food moved to the fridge", sub: "future Larain gets taken care of" },
    { id: "homework", emoji: "📚", title: "Homework touchpoint", sub: "even a small start is a real start" },
  ];

  const MOODS = [
    { id: "rough", emoji: "🌧️", label: "rough" },
    { id: "fresh", emoji: "🌱", label: "fresh" },
    { id: "radiant", emoji: "☀️", label: "radiant" },
    { id: "tender", emoji: "🌙", label: "tender" },
  ];

  const DATED_NOTES = {
    // Add a date like "2026-06-14": "Your message for that day.",
  };

  const LOVE_NOTES = [
    "I care about you more than a checkbox could ever say.",
    "Loving you is the easiest thing I do.",
    "I trust you always, even on the days you doubt yourself.",
    "You make ordinary days feel softer just by being in them.",
    "I am proud of you for trying, resting, and starting again.",
    "You are safe with me, in the loud days and the quiet ones.",
    "I believe in you without needing you to prove anything first.",
    "You are my favorite thought in the middle of a busy day.",
    "I love the way your heart notices little things.",
    "You do not have to be perfect to be deeply loved.",
    "I am cheering for you in every tiny step.",
    "You are stronger than the version of you that gets tired.",
    "I hope today treats you gently, because you deserve gentle things.",
    "I love being on your team.",
    "You make me want to be softer, kinder, and better.",
    "I trust your heart and I trust your pace.",
    "You are doing better than your worried thoughts say you are.",
    "I love you in the easy moments and the messy ones too.",
    "You are not behind. You are becoming.",
    "I am grateful for you in ways I still do not know how to explain.",
    "Even your smallest wins matter to me.",
    "I hope you remember that you are loved before you do anything today.",
    "You have a light that does not disappear when you are tired.",
    "I am proud of the way you keep going.",
    "You are allowed to take up space, ask for care, and be soft.",
    "I love your mind, your effort, and your little everyday magic.",
    "You are my peace, even when the day is not peaceful.",
    "I trust us, and I trust you.",
    "Every day, I find another reason to adore you.",
    "You are loved on purpose, not by accident.",
  ];

  const NOTE_SWITCH_HOUR = 8;
  const STORAGE_KEY = "larain-tracker-v1";
  const habitIds = HABITS.map((habit) => habit.id);

  const dateEl = document.getElementById("date");
  const loveNoteEl = document.getElementById("loveNote");
  const streakEl = document.getElementById("streak");
  const streakSubEl = document.getElementById("streakSub");
  const progressNumberEl = document.getElementById("progressNumber");
  const progressFillEl = document.getElementById("progressFill");
  const progressCopyEl = document.getElementById("progressCopy");
  const moodOptionsEl = document.getElementById("moodOptions");
  const moodSelectedEl = document.getElementById("moodSelected");
  const cardsContainerEl = document.getElementById("cardsContainer");
  const summaryEl = document.getElementById("summary");
  const summaryMsgEl = document.getElementById("summaryMsg");
  const summarySubEl = document.getElementById("summarySub");
  const tinyWinEl = document.getElementById("tinyWin");
  const saveStateEl = document.getElementById("saveState");
  const shareButtonEl = document.getElementById("shareButton");
  const weekStripEl = document.getElementById("weekStrip");
  const weekScoreEl = document.getElementById("weekScore");

  let audioContext;
  let saveTimer;
  let todayData = getDay(todayKey());

  function defaultDay() {
    return {
      skincare: false,
      freezer: false,
      homework: false,
      mood: "",
      messageToFiras: "",
      tinyWin: "",
    };
  }

  function keyForDate(date) {
    return [
      date.getFullYear(),
      String(date.getMonth() + 1).padStart(2, "0"),
      String(date.getDate()).padStart(2, "0"),
    ].join("-");
  }

  function todayKey() {
    return keyForDate(new Date());
  }

  function formatDate() {
    return new Date().toLocaleDateString("en-US", {
      weekday: "long",
      month: "long",
      day: "numeric",
    });
  }

  function loadAll() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    } catch {
      return {};
    }
  }

  function saveAll(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function normalizeDay(day) {
    const normalized = { ...defaultDay(), ...(day || {}) };

    if (!normalized.messageToFiras && normalized.tinyWin) {
      normalized.messageToFiras = normalized.tinyWin;
    }

    return normalized;
  }

  function getDay(key) {
    return normalizeDay(loadAll()[key]);
  }

  function setDay(key, data) {
    const all = loadAll();
    all[key] = normalizeDay(data);
    saveAll(all);
  }

  function completedCount(data) {
    return habitIds.reduce((count, id) => count + (data[id] ? 1 : 0), 0);
  }

  function isComplete(data) {
    return completedCount(data) === HABITS.length;
  }

  function noteForToday() {
    const noteDate = noteRotationDate();
    const key = keyForDate(noteDate);
    if (DATED_NOTES[key]) return DATED_NOTES[key];

    const start = new Date(noteDate.getFullYear(), 0, 0);
    const diff = noteDate - start;
    const dayOfYear = Math.floor(diff / 86400000);
    return LOVE_NOTES[dayOfYear % LOVE_NOTES.length];
  }

  function noteRotationDate() {
    const now = new Date();
    const noteDate = new Date(now);

    if (now.getHours() < NOTE_SWITCH_HOUR) {
      noteDate.setDate(noteDate.getDate() - 1);
    }

    noteDate.setHours(0, 0, 0, 0);
    return noteDate;
  }

  function scheduleNoteRefresh() {
    const now = new Date();
    const nextSwitch = new Date(now);
    nextSwitch.setHours(NOTE_SWITCH_HOUR, 0, 1, 0);

    if (now >= nextSwitch) {
      nextSwitch.setDate(nextSwitch.getDate() + 1);
    }

    window.setTimeout(() => {
      loveNoteEl.textContent = noteForToday();
      scheduleNoteRefresh();
    }, nextSwitch - now);
  }

  function initAudio() {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playTone(kind = "check") {
    try {
      initAudio();
      const now = audioContext.currentTime;
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const start = kind === "mood" ? 520 : kind === "uncheck" ? 360 : 680;
      const end = kind === "uncheck" ? 300 : start * 1.22;

      osc.type = "sine";
      osc.frequency.setValueAtTime(start, now);
      osc.frequency.exponentialRampToValueAtTime(end, now + 0.13);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);

      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.start(now);
      osc.stop(now + 0.14);
    } catch {
      // Some browsers block audio until the first user gesture.
    }
  }

  function confetti() {
    const pieces = ["💗", "✨", "🌸", "💌", "🫧", "🌷"];

    for (let i = 0; i < 22; i += 1) {
      const el = document.createElement("div");
      el.className = "confetti";
      el.textContent = pieces[Math.floor(Math.random() * pieces.length)];
      el.style.left = `${Math.random() * 100}vw`;
      el.style.animationDelay = `${Math.random() * 0.45}s`;
      el.style.animationDuration = `${2200 + Math.random() * 1200}ms`;
      document.body.appendChild(el);
      window.setTimeout(() => el.remove(), 3900);
    }
  }

  function renderMood() {
    const selectedMood = MOODS.find((mood) => mood.id === todayData.mood);
    moodSelectedEl.textContent = selectedMood ? selectedMood.emoji : "not picked yet";
    moodOptionsEl.innerHTML = "";

    MOODS.forEach((mood) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "mood-button";
      button.title = mood.label;
      button.setAttribute("aria-pressed", String(todayData.mood === mood.id));
      button.setAttribute("aria-label", `Today feels ${mood.label}`);
      button.innerHTML = `
        <span class="mood-emoji" aria-hidden="true">${mood.emoji}</span>
      `;

      button.addEventListener("click", () => {
        todayData.mood = todayData.mood === mood.id ? "" : mood.id;
        setDay(todayKey(), todayData);
        playTone("mood");
        renderAll();
      });

      moodOptionsEl.appendChild(button);
    });
  }

  function renderCards() {
    cardsContainerEl.innerHTML = "";

    HABITS.forEach((habit) => {
      const isDone = Boolean(todayData[habit.id]);
      const card = document.createElement("button");
      card.type = "button";
      card.className = `habit-card${isDone ? " done" : ""}`;
      card.setAttribute("aria-pressed", String(isDone));
      card.setAttribute("aria-label", `${habit.title}: ${isDone ? "done" : "not done"}`);
      card.innerHTML = `
        <div class="habit-row">
          <div class="habit-emoji" aria-hidden="true">${habit.emoji}</div>
          <div>
            <p class="habit-title">${habit.title}</p>
            <p class="habit-sub">${habit.sub}</p>
          </div>
          <div class="check" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
        </div>
      `;

      card.addEventListener("click", () => {
        const wasComplete = isComplete(todayData);
        const isChecking = !todayData[habit.id];

        todayData[habit.id] = isChecking;
        setDay(todayKey(), todayData);
        playTone(isChecking ? "check" : "uncheck");
        renderAll();

        if (!wasComplete && isComplete(todayData)) {
          confetti();
        }
      });

      cardsContainerEl.appendChild(card);
    });
  }

  function renderOverview() {
    const count = completedCount(todayData);
    const percent = Math.round((count / HABITS.length) * 100);

    progressNumberEl.textContent = `${count}/${HABITS.length}`;
    progressFillEl.style.width = `${percent}%`;

    if (count === 0) {
      progressCopyEl.textContent = "Pick one tiny thing first.";
    } else if (count === HABITS.length) {
      progressCopyEl.textContent = "All done. You took care of yourself today.";
    } else {
      progressCopyEl.textContent = `${HABITS.length - count} little ${HABITS.length - count === 1 ? "thing" : "things"} left.`;
    }

    const streak = computeStreak();
    streakEl.textContent = streak === 1 ? "1 day" : `${streak} days`;
    streakSubEl.textContent = streak > 0 ? "Look at you showing up." : "A soft restart still counts.";
  }

  function renderSummary() {
    const count = completedCount(todayData);
    const mood = MOODS.find((item) => item.id === todayData.mood);

    if (count === 0 && !mood) {
      summaryEl.classList.remove("is-visible");
      return;
    }

    summaryEl.classList.add("is-visible");

    if (count === HABITS.length) {
      summaryMsgEl.textContent = "you did it all today 🌟";
      summarySubEl.textContent = mood
        ? "And you checked in with yourself. I am proud of you."
        : "Proud of you. Go rest, queen.";
    } else if (count === 2) {
      summaryMsgEl.textContent = "almost there ✨";
      summarySubEl.textContent = mood
        ? "Two checks on this kind of day is very real."
        : "One more little thing, only if you have it in you.";
    } else if (count === 1) {
      summaryMsgEl.textContent = "good start 🌷";
      summarySubEl.textContent = mood
        ? "A day like this still deserves softness."
        : "One check-in is still care.";
    } else {
      summaryMsgEl.textContent = `${mood.emoji} day`;
      summarySubEl.textContent = "No pressure. Just a little check-in with yourself.";
    }
  }

  function computeStreak() {
    let streak = 0;
    const today = new Date();

    for (let i = 0; i < 365; i += 1) {
      const day = new Date(today);
      day.setDate(today.getDate() - i);
      const data = getDay(keyForDate(day));

      if (isComplete(data)) {
        streak += 1;
      } else if (i > 0) {
        break;
      }
    }

    return streak;
  }

  function loadWeek() {
    const today = new Date();
    const days = [];

    for (let i = 6; i >= 0; i -= 1) {
      const date = new Date(today);
      date.setDate(today.getDate() - i);
      const key = keyForDate(date);
      days.push({ key, date, data: getDay(key) });
    }

    return days;
  }

  function renderWeek() {
    const days = loadWeek();
    const today = todayKey();
    const totalChecks = days.reduce((sum, day) => sum + completedCount(day.data), 0);

    weekScoreEl.textContent = `${totalChecks} ${totalChecks === 1 ? "check" : "checks"}`;
    weekStripEl.innerHTML = "";

    days.forEach(({ key, date, data }) => {
      const count = completedCount(data);
      const mood = MOODS.find((item) => item.id === data.mood);
      const cell = document.createElement("div");
      const status = count === HABITS.length ? "full" : count > 0 ? "partial" : "";
      const weekday = date.toLocaleDateString("en-US", { weekday: "short" }).slice(0, 1);

      cell.className = `day-cell ${status}${key === today ? " today" : ""}`;
      cell.innerHTML = `
        <span>${weekday}</span>
        <span class="day-dot">${count === HABITS.length ? "✓" : count || ""}</span>
        <span class="day-mood">${mood ? mood.emoji : ""}</span>
      `;
      weekStripEl.appendChild(cell);
    });
  }

  function renderMessageToFiras() {
    if (document.activeElement !== tinyWinEl) {
      tinyWinEl.value = todayData.messageToFiras || "";
    }
  }

  function saveMessageToFiras(value) {
    todayData.messageToFiras = value.trimStart();
    todayData.tinyWin = todayData.messageToFiras;
    setDay(todayKey(), todayData);
    saveStateEl.textContent = "saved here";
    window.clearTimeout(saveTimer);
    saveTimer = window.setTimeout(() => {
      saveStateEl.textContent = "";
    }, 1300);
    renderWeek();
  }

  function buildFirasUpdate() {
    const mood = MOODS.find((item) => item.id === todayData.mood);
    const streak = computeStreak();
    const doneHabits = HABITS
      .filter((habit) => todayData[habit.id])
      .map((habit) => habit.title)
      .join(", ");

    return [
      `Larain's check-in for ${formatDate()}`,
      `Mood: ${mood ? `${mood.emoji} ${mood.label}` : "not picked"}`,
      `Streak: ${streak === 1 ? "1 day" : `${streak} days`}`,
      `Checks: ${completedCount(todayData)}/${HABITS.length}${doneHabits ? ` - ${doneHabits}` : ""}`,
      `Message to Firas: ${todayData.messageToFiras || "(empty)"}`,
    ].join("\n");
  }

  async function shareUpdateForFiras() {
    const text = buildFirasUpdate();

    try {
      if (navigator.share) {
        await navigator.share({ title: "Larain's check-in", text });
        saveStateEl.textContent = "shared";
      } else if (navigator.clipboard) {
        await navigator.clipboard.writeText(text);
        saveStateEl.textContent = "copied for Firas";
      } else {
        const helper = document.createElement("textarea");
        helper.value = text;
        document.body.appendChild(helper);
        helper.select();
        document.execCommand("copy");
        helper.remove();
        saveStateEl.textContent = "copied for Firas";
      }
    } catch {
      saveStateEl.textContent = "copy did not work";
    }

    window.clearTimeout(saveTimer);
    saveTimer = window.setTimeout(() => {
      saveStateEl.textContent = "";
    }, 1800);
  }

  function renderAll() {
    renderOverview();
    renderMood();
    renderCards();
    renderSummary();
    renderMessageToFiras();
    renderWeek();
  }

  dateEl.textContent = formatDate();
  loveNoteEl.textContent = noteForToday();
  scheduleNoteRefresh();
  tinyWinEl.addEventListener("input", (event) => saveMessageToFiras(event.target.value));
  shareButtonEl.addEventListener("click", shareUpdateForFiras);
  renderAll();
</script>
</body>
</html>
